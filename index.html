<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0d6efd" />
    <title>نواة نظام إدارة الصيدلية | المرحلة 0</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.rtl.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="assets/css/utilities.css" />
    <link rel="stylesheet" href="assets/css/components.css" />
    <link rel="stylesheet" href="assets/css/app.css" />
  </head>
  <body class="app-body" data-page="home">
    <div id="app-shell"></div>

    <main class="container py-4">
      <section class="card clean-card mb-3">
        <div class="card-body">
          <h1 class="h4 mb-2">مرحبًا بك في نواة المشروع</h1>
          <p class="text-secondary mb-0">
            هذه الصفحة مخصصة لتجهيز الأساس التقني للنسخة الأولى من نظام إدارة الصيدلية.
          </p>
        </div>
      </section>

      <section class="card clean-card mb-3">
        <div class="card-body">
          <h2 class="h6 mb-3">حالة المرحلة الحالية</h2>
          <div class="d-flex align-items-center justify-content-between gap-2 flex-wrap">
            <span class="badge status-badge bg-primary-subtle text-primary-emphasis">المرحلة 0</span>
            <span class="badge status-badge bg-success-subtle text-success-emphasis">الأساس جاهز للتوسعة</span>
          </div>
        </div>
      </section>

      <section class="card clean-card">
        <div class="card-body">
          <h2 class="h6 mb-3">اختبار اتصال Supabase</h2>
          <p class="text-secondary small mb-3">
            الاختبار يتحقق من الوصول إلى إعدادات المصادقة في مشروع Supabase عبر المفتاح العام فقط.
          </p>
          <div class="d-grid gap-2">
            <button id="test-connection-btn" class="btn btn-primary">اختبار الاتصال الآن</button>
          </div>
          <div id="connection-status" class="mt-3 small" role="status" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script type="module" src="assets/js/app.js"></script>
  </body>
</html>
